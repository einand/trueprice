<div id="table">Laddar verifierade årsdata…</div><script>fetch('{{ "data/series.json" | relURL }}').then(r=>r.json()).then(x=>{const f=n=>n==null?'—':n.toLocaleString('sv-SE',{maximumFractionDigits:2});let h='<table><thead><tr><th>År</th><th>Bensin (kr/l)</th><th>Genomsnittslön (kr/mån)</th><th>Årslön (kr)</th><th>Andel av årslön</th><th>Trend mot föregående år</th></tr></thead><tbody>';for(const d of x.data)h+=`<tr><td>${d.year}</td><td>${f(d.gasoline_price_sek_per_liter)}</td><td>${f(d.average_monthly_salary_sek)}</td><td>${f(d.average_annual_salary_sek)}</td><td>${d.share_percent==null?'—':f(d.share_percent)+' %'}</td><td class="${d.trend?.startsWith('dyrare')?'up':d.trend?.startsWith('billigare')?'down':''}">${d.trend||'—'}</td></tr>`;document.querySelector('#table').innerHTML=h+'</tbody></table><small><a href="{{ "data/series.json" | relURL }}">JSON och källmetadata</a></small>'})</script>
